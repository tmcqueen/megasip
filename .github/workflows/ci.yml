name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: clippy, build, test
    runs-on: ubuntu-latest
    # The runner image (Ubuntu 24.04) only has Qt 6.4, so build inside Ubuntu 26.04,
    # which ships Qt 6.10. No KDE Frameworks: the UI builds against plain Qt.
    container: ubuntu:26.04
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            build-essential pkg-config clang lld \
            qt6-base-dev qt6-declarative-dev libasound2-dev
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  windows-core:
    # The toolkit-free core's tests (named pipes, Credential Manager, process start times),
    # run for real on Windows.
    name: megasip-core on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p megasip-core --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test -p megasip-core --locked

  windows-app:
    # The Qt app on Windows with the official Qt build, packaged with windeployqt into a
    # zip that runs on a machine without Qt. The packaged copy is then run on its own (Qt
    # taken off PATH) to screenshot every screen, offscreen. The zip and the screenshots
    # are uploaded as artifacts. Releases get their zip from the Release workflow.
    name: MegaSIP on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          arch: win64_msvc2022_64
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p megasip-qt --locked --all-targets -- -D warnings
      - name: Build (release)
        run: cargo build -p megasip-qt --release --locked
      - name: Package
        id: package
        shell: pwsh
        run: packaging\windows-package.ps1 -Source . -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}
      - name: Screenshots (packaged copy, without Qt on PATH)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dist = "dist\${{ steps.package.outputs.name }}"
          # Only for this run: the offscreen platform plugin isn't part of the package.
          Copy-Item "$env:QT_ROOT_DIR\plugins\platforms\qoffscreen.dll" "$dist\platforms\"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH, Env:QML_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = "offscreen"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\shots" | Out-Null
          $env:MEGASIP_SCREENSHOT = "$env:RUNNER_TEMP\shots\megasip"
          $p = Start-Process "$dist\megasip.exe" -Wait -PassThru -NoNewWindow
          "exit code $($p.ExitCode)"
          $shots = Get-ChildItem "$env:RUNNER_TEMP\shots" -Filter *.png
          "$($shots.Count) screenshots"
          if ($shots.Count -lt 20) { throw "expected at least 20 screenshots" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
