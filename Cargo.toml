[package]
name = "megasip"
version = "0.1.0"
edition = "2021"
description = "A KDE/Wayland voice-only port of the MicroSIP softphone"
license = "GPL-2.0-or-later"

[dependencies]
rsiprtp = "=0.4.1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sonora = "0.3.0"
lewton = "0.10.2"
ctrlc = { version = "3.5.3", features = ["termination"] }
venator = "1.1.0"
tracing-log = "0.2"
secret-service = { version = "6", features = ["crypto-rust"] }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
