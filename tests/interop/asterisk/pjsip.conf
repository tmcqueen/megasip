[udp]
type=transport
protocol=udp
bind=127.0.0.1:5070

[tcp]
type=transport
protocol=tcp
bind=127.0.0.1:5070

[ep](!)
type=endpoint
context=default
disallow=all
allow=opus,g722,ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[aor](!)
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=0

[au](!)
type=auth
auth_type=userpass

[1001](ep)
auth=1001
aors=1001
callerid="Alice Test" <1001>
[1001](au)
username=1001
password=secret1
[1001](aor)

[1002](ep)
auth=1002
aors=1002
callerid="Bob Test" <1002>
[1002](au)
username=1002
password=secret2
[1002](aor)

[1003](ep)
auth=1003
aors=1003
allow=!opus,!g722
callerid="Carol Ulaw" <1003>
[1003](au)
username=1003
password=secret3
[1003](aor)

[1004](ep)
auth=1004
aors=1004
media_encryption=sdes
callerid="Dave SRTP" <1004>
[1004](au)
username=1004
password=secret4
[1004](aor)
